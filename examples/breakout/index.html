<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON BREAKOUT</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #05060d;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', 'Arial', sans-serif;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #0c1024 0%, #05060d 70%);
  }
  #wrap { position: relative; }
  canvas {
    display: block;
    max-width: 98vw; max-height: 98vh;
    touch-action: none;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(0, 229, 255, .18), 0 0 120px rgba(178, 107, 255, .10);
    cursor: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
"use strict";
/* ============================================================
   NEON BREAKOUT — single-file HTML5 canvas game
   ============================================================ */
(() => {

// ---------- Setup ----------
const W = 800, H = 600;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
canvas.width = W * DPR; canvas.height = H * DPR;
ctx.scale(DPR, DPR);

const HUD_H = 44;
const SIDE = 24;
const COLS = 13, GAP = 6, BRICK_H = 22, BRICK_TOP = 74;
const BRICK_W = (W - SIDE * 2 - GAP * (COLS - 1)) / COLS;
const PADDLE_Y = H - 42;
const BALL_R = 7;
const BASE_SPEED = 330, MAX_SPEED = 640;
const ROW_COLORS = ['#ff2d6f','#ff8a00','#ffe600','#00ff88','#00cfff','#b26bff','#ff5ce1','#ff2d6f','#ff8a00','#ffe600'];

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);

// ---------- Audio (Web Audio API) ----------
let actx = null, muted = false;
function audio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur = 0.08, type = 'square', vol = 0.12, slideTo = 0, delay = 0) {
  if (muted) return;
  try {
    const a = audio(), t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) { /* audio unavailable */ }
}
const SFX = {
  brick(row, rows)    { tone(300 + (rows - 1 - row) * 90, 0.07, 'square', 0.10); },
  paddle()            { tone(196, 0.09, 'triangle', 0.22, 130); },
  wall()              { tone(520, 0.05, 'sine', 0.10); },
  powerup()           { tone(523, .07, 'sine', .14); tone(659, .07, 'sine', .14, 0, .07); tone(880, .12, 'sine', .14, 0, .14); },
  lifeLost()          { tone(440, .18, 'sawtooth', .14, 110); tone(220, .35, 'sawtooth', .12, 60, .12); },
  gameOver()          { tone(330, .3, 'sawtooth', .13, 165); tone(247, .3, 'sawtooth', .13, 123, .25); tone(165, .8, 'sawtooth', .13, 55, .5); },
  levelClear()        { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .14, 'square', .11, 0, i * .09)); },
  launch()            { tone(392, .06, 'sine', .13, 660); },
};

// ---------- Levels ----------
const LEVELS = [
  { name: 'GRID',    rows: 6, layout: () => true },
  { name: 'PYRAMID', rows: 6, layout: (r, c) => c >= r && c < COLS - r },
  { name: 'CHECKER', rows: 7, layout: (r, c) => (r + c) % 2 === 0 },
];

// ---------- State ----------
let state = 'start'; // start | ready | playing | levelclear | gameover | win | paused
let score = 0, lives = 3, level = 0;
let best = +(localStorage.getItem('neonBreakoutBest') || 0);
let bricks = [], balls = [], powerups = [], particles = [], popups = [];
let paddleX = W / 2, paddleW = 110, paddleTargetW = 110;
let wideTimer = 0, slowTimer = 0;
let shake = 0, flashT = 0, stateT = 0;
let pointerX = W / 2;
let buttonRect = null, buttonHover = false;
let celebrateT = 0;

// ---------- Background (pre-rendered offscreen) ----------
const bg = document.createElement('canvas');
bg.width = W * DPR; bg.height = H * DPR;
{
  const b = bg.getContext('2d');
  b.scale(DPR, DPR);
  b.fillStyle = '#0a0d1c';
  b.fillRect(0, 0, W, H);
  // faint grid
  b.strokeStyle = 'rgba(60, 80, 140, 0.08)';
  b.lineWidth = 1;
  for (let x = 0; x <= W; x += 40) { b.beginPath(); b.moveTo(x + .5, 0); b.lineTo(x + .5, H); b.stroke(); }
  for (let y = 0; y <= H; y += 40) { b.beginPath(); b.moveTo(0, y + .5); b.lineTo(W, y + .5); b.stroke(); }
  // vignette
  const g = b.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .85);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.55)');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  // scanlines
  b.fillStyle = 'rgba(0,0,0,0.12)';
  for (let y = 0; y < H; y += 3) b.fillRect(0, y, W, 1);
}

// ---------- Entities ----------
function makeBall(x, y, speed, angle) {
  return { x, y, r: BALL_R, speed, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, trail: [] };
}
function ballSpeedNow() { return Math.min(MAX_SPEED, BASE_SPEED + level * 25); }

function buildLevel(idx) {
  const L = LEVELS[idx];
  bricks = []; powerups = []; particles = []; popups = [];
  for (let r = 0; r < L.rows; r++) {
    for (let c = 0; c < COLS; c++) {
      if (!L.layout(r, c)) continue;
      bricks.push({
        x: SIDE + c * (BRICK_W + GAP),
        y: BRICK_TOP + r * (BRICK_H + GAP),
        w: BRICK_W, h: BRICK_H, row: r, rows: L.rows,
        color: ROW_COLORS[r % ROW_COLORS.length],
        points: (L.rows - r) * 10,
        alive: true,
      });
    }
  }
  resetBallOnPaddle();
}
function resetBallOnPaddle() {
  balls = [makeBall(paddleX, PADDLE_Y - BALL_R - 3, ballSpeedNow(), -Math.PI / 2)];
  balls[0].stuck = true;
  wideTimer = 0; slowTimer = 0; paddleTargetW = 110;
}
function launchBall() {
  const b = balls[0];
  if (!b || !b.stuck) return;
  b.stuck = false;
  const ang = -Math.PI / 2 + rand(-0.45, 0.45);
  b.vx = Math.cos(ang) * b.speed; b.vy = Math.sin(ang) * b.speed;
  SFX.launch();
  state = 'playing';
}
function newGame() {
  score = 0; lives = 3; level = 0;
  buildLevel(0);
  state = 'ready';
}
function nextLevel() {
  level++;
  if (level >= LEVELS.length) {
    state = 'win'; stateT = 0;
    if (score > best) { best = score; localStorage.setItem('neonBreakoutBest', best); }
    SFX.levelClear();
  } else {
    buildLevel(level);
    state = 'ready';
  }
}

// ---------- Power-ups ----------
const PU_TYPES = [
  { id: 'wide',  label: 'W', name: 'WIDE PADDLE',   color: '#00e5ff' },
  { id: 'multi', label: 'M', name: 'MULTI-BALL',    color: '#ff9e00' },
  { id: 'slow',  label: 'S', name: 'SLOW MOTION',   color: '#7c9dff' },
  { id: 'life',  label: '+', name: 'EXTRA LIFE',    color: '#ff2d75' },
];
function maybeDropPowerup(x, y) {
  if (Math.random() < 0.10) {
    const t = PU_TYPES[(Math.random() * PU_TYPES.length) | 0];
    powerups.push({ x, y, w: 30, h: 18, vy: 120, t, spin: rand(0, Math.PI * 2) });
  }
}
function applyPowerup(t) {
  SFX.powerup();
  flashT = 0.15;
  if (t.id === 'wide')  { wideTimer = 12; paddleTargetW = 170; }
  if (t.id === 'multi') {
    const src = balls[0];
    if (src) {
      const base = Math.atan2(src.vy, src.vx);
      for (const off of [-0.55, 0.55]) {
        const nb = makeBall(src.x, src.y, src.speed, base + off);
        nb.stuck = false; balls.push(nb);
      }
    }
  }
  if (t.id === 'slow')  { slowTimer = 8; }
  if (t.id === 'life')  { lives = Math.min(6, lives + 1); }
}

// ---------- Particles & popups ----------
function burst(x, y, color, n = 14, speed = 260) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(speed * .25, speed);
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60,
      life: rand(.35, .8), maxLife: .8, color,
      size: rand(2, 5), rot: rand(0, Math.PI * 2), vr: rand(-8, 8),
    });
  }
}
function confetti() {
  const colors = ['#ff2d6f','#ffe600','#00ff88','#00cfff','#b26bff','#ff9e00'];
  for (let i = 0; i < 6; i++) {
    particles.push({
      x: rand(SIDE, W - SIDE), y: rand(BRICK_TOP, H * .55),
      vx: rand(-120, 120), vy: rand(-260, -60),
      life: rand(.8, 1.6), maxLife: 1.6,
      color: colors[(Math.random() * colors.length) | 0],
      size: rand(3, 6), rot: rand(0, Math.PI * 2), vr: rand(-10, 10),
    });
  }
}
function popup(x, y, text, color = '#fff') {
  popups.push({ x, y, text, color, life: 1 });
}

// ---------- Collision helpers ----------
function hitRect(b, rx, ry, rw, rh) {
  const cx = clamp(b.x, rx, rx + rw), cy = clamp(b.y, ry, ry + rh);
  const dx = b.x - cx, dy = b.y - cy;
  return dx * dx + dy * dy <= b.r * b.r;
}

// ---------- Input ----------
function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}
canvas.addEventListener('pointermove', e => {
  const p = canvasPos(e);
  pointerX = p.x;
  buttonHover = !!(buttonRect && p.x >= buttonRect.x && p.x <= buttonRect.x + buttonRect.w &&
                   p.y >= buttonRect.y && p.y <= buttonRect.y + buttonRect.h);
  canvas.style.cursor = (buttonHover || state === 'start' || state === 'ready' || state === 'playing') ? 'none' : 'pointer';
});
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  audio(); // unlock audio on first gesture
  const p = canvasPos(e);
  if (state === 'start') { newGame(); return; }
  if (state === 'ready') { launchBall(); return; }
  if ((state === 'gameover' || state === 'win') && buttonRect) {
    if (p.x >= buttonRect.x && p.x <= buttonRect.x + buttonRect.w &&
        p.y >= buttonRect.y && p.y <= buttonRect.y + buttonRect.h) newGame();
    return;
  }
});
window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    audio();
    if (state === 'start') newGame();
    else if (state === 'ready') launchBall();
    else if (state === 'gameover' || state === 'win') newGame();
    else if (state === 'playing') { state = 'paused'; }
    else if (state === 'paused') { state = 'playing'; }
  }
  if (e.code === 'Enter' && (state === 'gameover' || state === 'win')) newGame();
  if (e.code === 'KeyP' && (state === 'playing' || state === 'paused')) {
    state = state === 'playing' ? 'paused' : 'playing';
  }
  if (e.code === 'KeyM') { muted = !muted; popup(W / 2, H - 80, muted ? 'MUTED' : 'SOUND ON', '#8fa3c8'); }
});

// ---------- Update ----------
function loseLife() {
  lives--;
  SFX.lifeLost();
  shake = 10;
  powerups = [];
  if (lives <= 0) {
    state = 'gameover'; stateT = 0;
    if (score > best) { best = score; localStorage.setItem('neonBreakoutBest', best); }
    SFX.gameOver();
  } else {
    resetBallOnPaddle();
    state = 'ready';
  }
}

function updateBall(b, dt, alive) {
  const dist = Math.hypot(b.vx, b.vy) * dt;
  const steps = Math.max(1, Math.ceil(dist / (b.r * 0.8)));
  const sdt = dt / steps;
  for (let s = 0; s < steps; s++) {
    b.x += b.vx * sdt;
    b.y += b.vy * sdt;

    // walls
    if (b.x - b.r < SIDE) { b.x = SIDE + b.r; b.vx = Math.abs(b.vx); SFX.wall(); burstWall(b.x, b.y); }
    else if (b.x + b.r > W - SIDE) { b.x = W - SIDE - b.r; b.vx = -Math.abs(b.vx); SFX.wall(); burstWall(b.x, b.y); }
    if (b.y - b.r < HUD_H) { b.y = HUD_H + b.r; b.vy = Math.abs(b.vy); SFX.wall(); burstWall(b.x, b.y); }

    // paddle
    if (b.vy > 0 && b.y + b.r >= PADDLE_Y && b.y - b.r < PADDLE_Y + 14 &&
        b.x > paddleX - paddleW / 2 - b.r && b.x < paddleX + paddleW / 2 + b.r) {
      const rel = clamp((b.x - paddleX) / (paddleW / 2), -1, 1);
      const ang = -Math.PI / 2 + rel * (Math.PI / 3); // up to 60° from vertical
      b.vx = Math.cos(ang) * b.speed;
      b.vy = Math.sin(ang) * b.speed;
      b.y = PADDLE_Y - b.r;
      SFX.paddle();
      burst(b.x, PADDLE_Y, '#00e5ff', 6, 140);
    }

    // bricks
    let hit = null;
    for (const br of bricks) {
      if (!br.alive) continue;
      if (hitRect(b, br.x, br.y, br.w, br.h)) { hit = br; break; }
    }
    if (hit) {
      // resolve bounce axis by smaller penetration
      const px = b.x < hit.x + hit.w / 2 ? (b.x + b.r) - hit.x : (hit.x + hit.w) - (b.x - b.r);
      const py = b.y < hit.y + hit.h / 2 ? (b.y + b.r) - hit.y : (hit.y + hit.h) - (b.y - b.r);
      if (px < py) b.vx = b.x < hit.x + hit.w / 2 ? -Math.abs(b.vx) : Math.abs(b.vx);
      else         b.vy = b.y < hit.y + hit.h / 2 ? -Math.abs(b.vy) : Math.abs(b.vy);

      hit.alive = false;
      score += hit.points;
      SFX.brick(hit.row, hit.rows);
      burst(hit.x + hit.w / 2, hit.y + hit.h / 2, hit.color, 16, 300);
      popup(hit.x + hit.w / 2, hit.y, '+' + hit.points, hit.color);
      maybeDropPowerup(hit.x + hit.w / 2 - 15, hit.y + hit.h / 2);
      shake = Math.max(shake, 3);

      // slight speed increase per brick hit
      b.speed = Math.min(MAX_SPEED, b.speed + 6);
      const m = Math.hypot(b.vx, b.vy);
      b.vx = b.vx / m * b.speed; b.vy = b.vy / m * b.speed;
      // prevent near-horizontal stall
      if (Math.abs(b.vy) < b.speed * 0.22) {
        b.vy = (b.vy >= 0 ? 1 : -1) * b.speed * 0.22;
        const vxmag = Math.sqrt(b.speed * b.speed - b.vy * b.vy);
        b.vx = (b.vx >= 0 ? 1 : -1) * vxmag;
      }
    }

    // fell below screen
    if (b.y - b.r > H) { alive.delete(b); return; }
  }
  // trail
  b.trail.push({ x: b.x, y: b.y });
  if (b.trail.length > 14) b.trail.shift();
}
function burstWall(x, y) { burst(x, y, '#5b6ea8', 4, 110); }

function update(dt) {
  stateT += dt;
  // paddle follows pointer
  paddleX = clamp(pointerX, SIDE + paddleW / 2, W - SIDE - paddleW / 2);
  paddleW += (paddleTargetW - paddleW) * Math.min(1, dt * 8);

  // effect timers
  if (wideTimer > 0) { wideTimer -= dt; if (wideTimer <= 0) paddleTargetW = 110; }
  if (slowTimer > 0) slowTimer -= dt;

  const ts = slowTimer > 0 ? 0.5 : 1; // time scale for world objects

  if (state === 'playing') {
    const alive = new Set(balls);
    for (const b of balls) {
      if (b.stuck) { b.x = paddleX; b.y = PADDLE_Y - b.r - 3; continue; }
      updateBall(b, dt * ts, alive);
    }
    balls = balls.filter(b => alive.has(b));
    if (balls.length === 0) { loseLife(); return; }

    // power-ups fall
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.y += p.vy * dt * ts;
      p.spin += dt * 3;
      if (p.y > H + 20) { powerups.splice(i, 1); continue; }
      if (p.y + p.h >= PADDLE_Y && p.y < PADDLE_Y + 14 &&
          p.x + p.w > paddleX - paddleW / 2 && p.x < paddleX + paddleW / 2) {
        applyPowerup(p.t);
        popup(p.x + p.w / 2, p.y - 6, p.t.name, p.t.color);
        burst(p.x + p.w / 2, p.y + p.h / 2, p.t.color, 12, 220);
        powerups.splice(i, 1);
      }
    }

    // level cleared?
    if (bricks.every(b => !b.alive)) {
      state = 'levelclear'; stateT = 0; celebrateT = 0;
      powerups = [];
      SFX.levelClear();
    }
  }

  if (state === 'levelclear') {
    celebrateT += dt;
    if (Math.random() < dt * 22) confetti();
    if (stateT > 2.6) nextLevel();
  }

  // particles / popups (all states)
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += 620 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += p.vr * dt;
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.life -= dt * 1.1;
    p.y -= 34 * dt;
    if (p.life <= 0) popups.splice(i, 1);
  }

  shake = Math.max(0, shake - dt * 26);
  flashT = Math.max(0, flashT - dt);
}

// ---------- Drawing ----------
function neonText(text, x, y, size, color, align = 'center', blur = 18, weight = '700') {
  ctx.save();
  ctx.font = `${weight} ${size}px 'Segoe UI', Arial, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.shadowColor = color; ctx.shadowBlur = blur;
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillText(text, x, y - 1);
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawHUD() {
  ctx.save();
  ctx.fillStyle = 'rgba(10, 13, 28, 0.9)';
  ctx.fillRect(0, 0, W, HUD_H);
  ctx.strokeStyle = 'rgba(0, 229, 255, 0.35)';
  ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.moveTo(0, HUD_H - .5); ctx.lineTo(W, HUD_H - .5); ctx.stroke();
  ctx.shadowBlur = 0;

  neonText('SCORE', 90, 14, 12, '#5b6ea8', 'center', 0, '600');
  neonText(String(score).padStart(6, '0'), 90, 31, 20, '#ffe600', 'center', 12);

  neonText('LEVEL', W / 2, 14, 12, '#5b6ea8', 'center', 0, '600');
  neonText(`${level + 1}/${LEVELS.length}`, W / 2, 31, 20, '#00ff88', 'center', 12);

  neonText('LIVES', W - 90, 14, 12, '#5b6ea8', 'center', 0, '600');
  for (let i = 0; i < lives; i++) {
    ctx.save();
    ctx.shadowColor = '#ff2d75'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#ff2d75';
    ctx.beginPath();
    ctx.arc(W - 122 + i * 22, 31, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  // active power-up indicators
  let ix = 10;
  ctx.font = "600 11px 'Segoe UI', Arial";
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  if (wideTimer > 0) { ctx.fillStyle = '#00e5ff'; ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 6; ctx.fillText('WIDE ' + Math.ceil(wideTimer) + 's', ix, HUD_H + 14); ix += 74; }
  if (slowTimer > 0) { ctx.fillStyle = '#7c9dff'; ctx.shadowColor = '#7c9dff'; ctx.shadowBlur = 6; ctx.fillText('SLOW ' + Math.ceil(slowTimer) + 's', ix, HUD_H + 14); }
  ctx.restore();
}

function drawBricks() {
  ctx.save();
  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.shadowColor = b.color; ctx.shadowBlur = 10;
    ctx.fillStyle = b.color;
    roundRect(b.x, b.y, b.w, b.h, 4); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    roundRect(b.x + 2, b.y + 2, b.w - 4, b.h / 2 - 2, 3); ctx.fill();
  }
  ctx.restore();
}

function drawPaddle() {
  ctx.save();
  const x = paddleX - paddleW / 2;
  ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 18;
  const g = ctx.createLinearGradient(x, PADDLE_Y, x, PADDLE_Y + 14);
  g.addColorStop(0, '#aef7ff'); g.addColorStop(.5, '#00e5ff'); g.addColorStop(1, '#0077aa');
  ctx.fillStyle = g;
  roundRect(x, PADDLE_Y, paddleW, 14, 7); ctx.fill();
  ctx.restore();
}

function drawBalls() {
  for (const b of balls) {
    // trail
    for (let i = 0; i < b.trail.length; i++) {
      const t = b.trail[i], f = i / b.trail.length;
      ctx.save();
      ctx.globalAlpha = f * 0.35;
      ctx.fillStyle = '#00e5ff';
      ctx.beginPath(); ctx.arc(t.x, t.y, b.r * f, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.save();
    ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 16;
    const g = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, b.r);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#9ff3ff');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawPowerups() {
  for (const p of powerups) {
    ctx.save();
    ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
    const s = 1 + Math.sin(p.spin) * 0.08;
    ctx.scale(s, 1 / s);
    ctx.shadowColor = p.t.color; ctx.shadowBlur = 14;
    ctx.fillStyle = 'rgba(12,16,32,0.95)';
    roundRect(-p.w / 2, -p.h / 2, p.w, p.h, 6); ctx.fill();
    ctx.strokeStyle = p.t.color; ctx.lineWidth = 2;
    roundRect(-p.w / 2, -p.h / 2, p.w, p.h, 6); ctx.stroke();
    ctx.shadowBlur = 8;
    ctx.fillStyle = p.t.color;
    ctx.font = "700 13px 'Segoe UI', Arial";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.t.label, 0, 1);
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 6;
    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
    ctx.restore();
  }
}
function drawPopups() {
  for (const p of popups) {
    ctx.save();
    ctx.globalAlpha = clamp(p.life, 0, 1);
    neonText(p.text, p.x, p.y, 14, p.color, 'center', 8, '700');
    ctx.restore();
  }
}

function drawButton(text) {
  const bw = 220, bh = 52;
  const bx = W / 2 - bw / 2, by = H / 2 + 76;
  buttonRect = { x: bx, y: by, w: bw, h: bh };
  ctx.save();
  const col = buttonHover ? '#00ff88' : '#00cfff';
  ctx.shadowColor = col; ctx.shadowBlur = buttonHover ? 24 : 14;
  ctx.fillStyle = 'rgba(12,16,32,0.95)';
  roundRect(bx, by, bw, bh, 10); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  roundRect(bx, by, bw, bh, 10); ctx.stroke();
  ctx.restore();
  neonText(text, W / 2, by + bh / 2 + 1, 20, buttonHover ? '#00ff88' : '#aef7ff', 'center', 10);
}

function drawOverlay(alpha) {
  ctx.fillStyle = `rgba(5, 6, 13, ${alpha})`;
  ctx.fillRect(0, 0, W, H);
}

function draw() {
  ctx.save();
  // screen shake
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));

  ctx.drawImage(bg, 0, 0, W, H);

  // side walls
  ctx.save();
  ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 10;
  ctx.fillStyle = 'rgba(0, 229, 255, 0.10)';
  ctx.fillRect(0, 0, SIDE, H);
  ctx.fillRect(W - SIDE, 0, SIDE, H);
  ctx.fillRect(0, 0, W, HUD_H);
  ctx.restore();

  if (state !== 'start') {
    drawBricks();
    drawPowerups();
    drawParticles();
    drawPaddle();
    drawBalls();
    drawPopups();
    drawHUD();
  }

  // powerup collect flash
  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flashT * 0.9})`;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- state screens ----
  if (state === 'start') {
    drawOverlay(0.55);
    const pulse = 1 + Math.sin(stateT * 2.4) * 0.03;
    ctx.save();
    ctx.translate(W / 2, H / 2 - 90); ctx.scale(pulse, pulse);
    neonText('NEON', 0, -34, 58, '#ff2d6f');
    neonText('BREAKOUT', 0, 26, 58, '#00e5ff');
    ctx.restore();
    neonText('3 LEVELS  •  4 POWER-UPS  •  3 LIVES', W / 2, H / 2 + 30, 15, '#8fa3c8', 'center', 4, '600');
    neonText('MOVE: MOUSE / TOUCH    LAUNCH: CLICK / SPACE', W / 2, H / 2 + 58, 13, '#5b6ea8', 'center', 0, '600');
    if (Math.sin(stateT * 4) > -0.3)
      neonText('CLICK OR PRESS SPACE TO START', W / 2, H / 2 + 110, 18, '#ffe600', 'center', 12);
    if (best > 0) neonText('BEST: ' + best, W / 2, H - 40, 14, '#8fa3c8', 'center', 0, '600');
  }

  if (state === 'ready') {
    if (Math.sin(stateT * 5) > -0.2)
      neonText('CLICK OR SPACE TO LAUNCH', W / 2, H - 110, 16, '#ffe600', 'center', 10);
  }

  if (state === 'paused') {
    drawOverlay(0.6);
    neonText('PAUSED', W / 2, H / 2 - 20, 44, '#00e5ff');
    neonText('PRESS SPACE OR P TO RESUME', W / 2, H / 2 + 30, 15, '#8fa3c8', 'center', 4, '600');
  }

  if (state === 'levelclear') {
    const t = Math.min(1, stateT / 0.4);
    const sc = 0.5 + t * 0.5;
    ctx.save();
    ctx.translate(W / 2, H / 2 - 40); ctx.scale(sc, sc);
    ctx.globalAlpha = t;
    neonText('LEVEL ' + (level + 1) + ' COMPLETE!', 0, 0, 42, '#00ff88');
    ctx.restore();
    neonText('SCORE  ' + score, W / 2, H / 2 + 18, 20, '#ffe600');
    if (stateT > 1.1) neonText('NEXT: ' + (level + 1 < LEVELS.length ? 'LEVEL ' + (level + 2) + ' — ' + LEVELS[level + 1].name : 'FINAL RESULTS'), W / 2, H / 2 + 52, 15, '#8fa3c8', 'center', 4, '600');
  }

  if (state === 'gameover' || state === 'win') {
    const t = Math.min(1, stateT / 0.5);
    drawOverlay(0.72 * t);
    ctx.save();
    ctx.globalAlpha = t;
    if (state === 'gameover') {
      neonText('GAME OVER', W / 2, H / 2 - 90, 52, '#ff2d6f');
    } else {
      const pulse = 1 + Math.sin(stateT * 3) * 0.04;
      ctx.translate(W / 2, H / 2 - 90); ctx.scale(pulse, pulse);
      neonText('YOU WIN!', 0, 0, 52, '#00ff88');
      ctx.restore(); ctx.save(); ctx.globalAlpha = t;
    }
    neonText('FINAL SCORE', W / 2, H / 2 - 20, 14, '#8fa3c8', 'center', 0, '600');
    neonText(String(score), W / 2, H / 2 + 14, 42, '#ffe600');
    neonText('BEST  ' + best + (score >= best && score > 0 ? '   ★ NEW BEST!' : ''), W / 2, H / 2 + 54, 15, score >= best && score > 0 ? '#00ff88' : '#8fa3c8', 'center', 6, '600');
    drawButton('PLAY AGAIN');
    neonText('OR PRESS SPACE / ENTER', W / 2, buttonRect.y + buttonRect.h + 26, 12, '#5b6ea8', 'center', 0, '600');
    ctx.restore();
  }

  ctx.restore();
}

// ---------- Main loop (delta-time, 60fps) ----------
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 1 / 30); // clamp so tab-switches don't teleport the ball
  if (state !== 'paused') update(dt);
  else stateT += 0; // paused: freeze everything
  draw();
  requestAnimationFrame(frame);
}
buildLevel(0); // show a board behind the title screen
requestAnimationFrame(frame);

})();
</script>
</body>
